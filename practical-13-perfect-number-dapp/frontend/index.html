<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Perfect Number DApp</title>
</head>
<body>
  <h2>Perfect Number Checker</h2>
  <button id="connectWalletBtn">Connect Wallet</button>
  <p>Status: <span id="walletStatus">Not connected</span></p>
  <br>
  <label for="numInput">Enter Number:</label>
  <input type="number" id="numInput" placeholder="e.g. 6 or 28">
  <button id="checkNumBtn">Check Perfect Number</button>
  <p>Transaction: <span id="txStatus">None</span></p>
  <br>
  <p>Result: <span id="resultDisplay">Unknown</span></p>
  <script type="module" src="./main.js"></script>
</body>
</html>
